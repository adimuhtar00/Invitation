<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="100%" height="100%">
  <defs>
    <!-- 1. FILTER 3D ART DECO / ROYAL GEOMETRIC RELIEF -->
    <filter id="geoGold3D" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#170b02" flood-opacity="0.45" result="shadow" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="0.95" specularExponent="28" lighting-color="#fff8db" result="specOut">
        <fePointLight x="-140" y="-140" z="220" />
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specClipped" />
      <feComposite in="SourceGraphic" in2="specClipped" operator="arithmetic" k1="0" k2="1" k3="0.65" k4="0" result="litGold" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="litGold" />
      </feMerge>
    </filter>

    <filter id="geoShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#1a0903" flood-opacity="0.38" />
    </filter>

    <filter id="gemGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.8" flood-color="#120305" flood-opacity="0.55" />
    </filter>

    <!-- 2. PALET GRADIEN LOGAM EMAS & PERMATA GEOMETRIS -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7cf" />
      <stop offset="30%" stop-color="#e0b254" />
      <stop offset="65%" stop-color="#875814" />
      <stop offset="100%" stop-color="#f7da88" />
    </linearGradient>

    <linearGradient id="goldDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5e3908" />
      <stop offset="50%" stop-color="#c49235" />
      <stop offset="100%" stop-color="#fcf0b8" />
    </linearGradient>

    <!-- Latar Enamel Maroon Geometris -->
    <linearGradient id="maroonFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#731723" />
      <stop offset="55%" stop-color="#450911" />
      <stop offset="100%" stop-color="#1f0206" />
    </linearGradient>

    <!-- Permata Ruby Berlian -->
    <linearGradient id="rubyFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ea9" />
      <stop offset="35%" stop-color="#b8142b" />
      <stop offset="80%" stop-color="#590411" />
      <stop offset="100%" stop-color="#290106" />
    </linearGradient>

    <!-- Permata Zamrud Berlian -->
    <linearGradient id="emeraldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9effd2" />
      <stop offset="35%" stop-color="#128a54" />
      <stop offset="80%" stop-color="#054226" />
      <stop offset="100%" stop-color="#021f11" />
    </linearGradient>

    <!-- Permata Safir Berlian -->
    <linearGradient id="sapphireFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0d6ff" />
      <stop offset="35%" stop-color="#1849a8" />
      <stop offset="80%" stop-color="#092159" />
      <stop offset="100%" stop-color="#030d29" />
    </linearGradient>

    <!-- 3. KOMPONEN GEOMETRIS TAJAM -->
    <!-- Permata Berlian Segi Delapan (Octagon Diamond Cut) -->
    <g id="royal-octagon-jewel" filter="url(#gemGlow)">
      <polygon points="-14,-22 14,-22 22,-14 22,14 14,22 -14,22 -22,14 -22,-14" fill="url(#goldBevel)" stroke="#3d2304" stroke-width="1" />
      <polygon points="-11,-17 11,-17 17,-11 17,11 11,17 -11,17 -17,11 -17,-11" fill="#260409" stroke="#f7dc88" stroke-width="0.7" />
      <polygon points="-8,-13 8,-13 13,-8 13,8 8,13 -8,13 -13,8 -13,-8" fill="url(#rubyFacet)" stroke="#ffe28a" stroke-width="0.8" />
      <polygon points="-4,-7 4,-7 7,-4 7,4 4,7 -4,7 -7,4 -7,-4" fill="none" stroke="#ffccd2" stroke-width="0.6" opacity="0.85" />
      <line x1="-13" y1="-8" x2="-7" y2="-4" stroke="#ffccd2" stroke-width="0.6" />
      <line x1="13" y1="-8" x2="7" y2="-4" stroke="#ffccd2" stroke-width="0.6" />
      <line x1="13" y1="8" x2="7" y2="4" stroke="#ffccd2" stroke-width="0.6" />
      <line x1="-13" y1="8" x2="-7" y2="4" stroke="#ffccd2" stroke-width="0.6" />
    </g>

    <!-- Permata Belah Ketupat (Diamond Lozenge) -->
    <g id="diamond-lozenge" filter="url(#gemGlow)">
      <polygon points="0,-16 11,0 0,16 -11,0" fill="url(#goldBevel)" stroke="#3d2304" stroke-width="0.8" />
      <polygon points="0,-11 7.5,0 0,11 -7.5,0" fill="url(#emeraldFacet)" stroke="#fff0b8" stroke-width="0.6" />
      <polygon points="0,-11 7.5,0 0,0" fill="#ffffff" opacity="0.3" />
    </g>

    <!-- Simpul Labirin Geometris -->
    <g id="geometric-meander">
      <polyline points="0,0 24,0 24,24 6,24 6,8 18,8 18,18 12,18" fill="none" stroke="url(#goldBevel)" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" />
    </g>

    <!-- 4. MASTER SUDUT KIRI ATAS -->
    <g id="geometric-royal-corner">
      <g filter="url(#geoShadow)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
        <polyline points="20,520 20,20 520,20" stroke="url(#goldBevel)" stroke-width="2.2" />
        <polyline points="28,480 28,28 480,28" stroke="url(#goldDark)" stroke-width="1.1" />
        <polyline points="36,430 36,36 430,36" stroke="url(#goldBevel)" stroke-width="0.8" stroke-dasharray="6 4" />
        <polygon points="20,20 175,20 145,50 50,50 50,145 20,175" fill="url(#maroonFacet)" stroke="url(#goldBevel)" stroke-width="1.6" />
        <polyline points="44,195 44,125 125,44 195,44" stroke="url(#goldBevel)" stroke-width="1.8" />
        <polyline points="52,210 52,132 132,52 210,52" stroke="url(#goldDark)" stroke-width="1.1" />
        <polyline points="60,225 60,140 140,60 225,60" stroke="url(#goldBevel)" stroke-width="0.8" />
      </g>

      <g filter="url(#geoGold3D)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
        <use href="#geometric-meander" transform="translate(185, 28)" />
        <use href="#geometric-meander" transform="translate(225, 28)" />
        <use href="#geometric-meander" transform="translate(265, 28)" />
        <use href="#geometric-meander" transform="translate(305, 28)" />
        <use href="#geometric-meander" transform="translate(345, 28)" />
        <use href="#geometric-meander" transform="translate(385, 28)" />

        <polyline points="175,60 195,76 215,60 235,76 255,60 275,76 295,60 315,76 335,60 355,76 375,60 395,76 415,60" stroke="url(#goldBevel)" stroke-width="1.5" />
        <polyline points="185,68 205,84 225,68 245,84 265,68 285,84 305,68 325,84 345,68 365,84 385,68 405,84" stroke="url(#goldDark)" stroke-width="1.1" />

        <polygon points="425,28 445,16 465,28 445,40" stroke="url(#goldBevel)" stroke-width="1.5" />
        <polygon points="465,28 485,18 505,28 485,38" stroke="url(#goldBevel)" stroke-width="1.3" />
        <polygon points="505,28 525,22 545,28 525,34" stroke="url(#goldBevel)" stroke-width="1.1" />
        <line x1="545" y1="28" x2="575" y2="28" stroke="url(#goldBevel)" stroke-width="1.6" />
        <polygon points="575,28 565,24 565,32" fill="url(#goldBevel)" />

        <use href="#geometric-meander" transform="translate(52, 185) rotate(90)" />
        <use href="#geometric-meander" transform="translate(52, 225) rotate(90)" />
        <use href="#geometric-meander" transform="translate(52, 265) rotate(90)" />
        <use href="#geometric-meander" transform="translate(52, 305) rotate(90)" />
        <use href="#geometric-meander" transform="translate(52, 345) rotate(90)" />
        <use href="#geometric-meander" transform="translate(52, 385) rotate(90)" />

        <polyline points="60,175 76,195 60,215 76,235 60,255 76,275 60,295 76,315 60,335 76,355 60,375 76,395 60,415" stroke="url(#goldBevel)" stroke-width="1.5" />
        <polyline points="68,185 84,205 68,225 84,245 68,265 84,285 68,305 84,325 68,345 84,365 68,385 84,405" stroke="url(#goldDark)" stroke-width="1.1" />

        <polygon points="28,425 16,445 28,465 40,445" stroke="url(#goldBevel)" stroke-width="1.5" />
        <polygon points="28,465 18,485 28,505 38,485" stroke="url(#goldBevel)" stroke-width="1.3" />
        <polygon points="28,505 22,525 28,545 34,525" stroke="url(#goldBevel)" stroke-width="1.1" />
        <line x1="28" y1="545" x2="28" y2="575" stroke="url(#goldBevel)" stroke-width="1.6" />
        <polygon points="28,575 24,565 32,565" fill="url(#goldBevel)" />

        <line x1="45" y1="45" x2="185" y2="185" stroke="url(#goldBevel)" stroke-width="1.8" />
        <line x1="45" y1="75" x2="165" y2="155" stroke="url(#goldDark)" stroke-width="1.2" />
        <line x1="75" y1="45" x2="155" y2="165" stroke="url(#goldDark)" stroke-width="1.2" />
        <line x1="45" y1="105" x2="145" y2="135" stroke="url(#goldBevel)" stroke-width="1" />
        <line x1="105" y1="45" x2="135" y2="145" stroke="url(#goldBevel)" stroke-width="1" />

        <polygon points="88,42 134,88 88,134 42,88" fill="url(#maroonFacet)" stroke="url(#goldBevel)" stroke-width="1.8" />
        <polygon points="88,52 124,88 88,124 52,88" fill="none" stroke="url(#goldDark)" stroke-width="1.1" />

        <polygon points="62,62 114,62 114,114 62,114" fill="none" stroke="url(#goldBevel)" stroke-width="1.4" />
        <polygon points="88,51 125,88 88,125 51,88" fill="none" stroke="url(#goldBevel)" stroke-width="1.4" />

        <polyline points="125,165 165,165 165,125" stroke="url(#goldBevel)" stroke-width="1.6" />
        <polyline points="135,175 175,175 175,135" stroke="url(#goldDark)" stroke-width="1.1" />
      </g>

      <use href="#royal-octagon-jewel" transform="translate(88, 88) scale(1.1)" />
      <use href="#diamond-lozenge" transform="translate(165, 165) rotate(-45) scale(1.05)" />

      <g filter="url(#gemGlow)">
        <polygon points="24,24 46,24 24,46" fill="url(#sapphireFacet)" stroke="#ffe699" stroke-width="0.9" />
        <polygon points="24,24 36,24 24,36" fill="#ffffff" opacity="0.25" />
      </g>

      <use href="#diamond-lozenge" transform="translate(295, 28) rotate(90) scale(0.62)" />
      <use href="#diamond-lozenge" transform="translate(445, 28) rotate(90) scale(0.68)" />
      <use href="#diamond-lozenge" transform="translate(28, 295) rotate(0) scale(0.62)" />
      <use href="#diamond-lozenge" transform="translate(28, 445) rotate(0) scale(0.68)" />

      <g fill="url(#goldBevel)" stroke="#3d2304" stroke-width="0.5">
        <rect x="192" y="73" width="6" height="6" transform="rotate(45 195 76)" />
        <rect x="232" y="73" width="6" height="6" transform="rotate(45 235 76)" />
        <rect x="272" y="73" width="6" height="6" transform="rotate(45 275 76)" />
        <rect x="312" y="73" width="6" height="6" transform="rotate(45 315 76)" />
        <rect x="352" y="73" width="6" height="6" transform="rotate(45 355 76)" />
        <rect x="392" y="73" width="6" height="6" transform="rotate(45 395 76)" />

        <rect x="73" y="192" width="6" height="6" transform="rotate(45 76 195)" />
        <rect x="73" y="232" width="6" height="6" transform="rotate(45 76 235)" />
        <rect x="73" y="272" width="6" height="6" transform="rotate(45 76 275)" />
        <rect x="73" y="312" width="6" height="6" transform="rotate(45 76 315)" />
        <rect x="73" y="352" width="6" height="6" transform="rotate(45 76 355)" />
        <rect x="73" y="392" width="6" height="6" transform="rotate(45 76 395)" />
      </g>
    </g>
  </defs>

  <use href="#geometric-royal-corner" x="0" y="0" />
  <use href="#geometric-royal-corner" transform="translate(1200, 0) scale(-1, 1)" />
  <use href="#geometric-royal-corner" transform="translate(0, 1800) scale(1, -1)" />
  <use href="#geometric-royal-corner" transform="translate(1200, 1800) scale(-1, -1)" />
</svg>